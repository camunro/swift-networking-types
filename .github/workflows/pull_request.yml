name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.17
    with:
      license_header_check_project_name: "Swift Networking Types"

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@fb-install-vsb
    with:
      # Also test release builds
      linux_command: |
        Debug-Test: swift test -Xswiftc -require-explicit-sendable
        Release-Build: swift build -c release
